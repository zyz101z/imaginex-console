<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Grump — A Corporate Survival Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1020; overflow: hidden; font-family: 'Fredoka', sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); aspect-ratio: 16 / 9; box-shadow: 0 0 80px rgba(255, 230, 0, 0.12); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffe600; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="loading">ALIGNING STAKEHOLDERS...</div>
</div>
<script type="module">
  import { boot } from './src/main.js?v=20260902s';
  boot(document.getElementById('game')).then(() => document.getElementById('loading').remove());
</script>
</body>
</html>
