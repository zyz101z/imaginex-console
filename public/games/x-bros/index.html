    spawnBurst(this.scene, opponent.sprite.x, opponent.sprite.y - 10, 0xff8844, 10, 200);
    spawnDamageNumber(this.scene, opponent.sprite.x, opponent.sprite.y, dmg);
    SFX.play("hit");
  }

  applyGrab(opponent, sp) {
    // Grabs pierce shields (kind "grab") but can still be dodged with i-frames.
    if (opponent.tryDefend(this, sp.dmg, "grab")) return;
    // A shield can't stop the tongue — drop it so the pull looks right.
    if (opponent.shielding) opponent.stopShield();
    const t = this.scene.time.now / 1000;
    opponent.damage += sp.dmg;
    this.damageDealt += sp.dmg;
    // Pin opponent in hitstun through the pull window + a beat after
    opponent.hitstunUntil = Math.max(opponent.hitstunUntil, t + sp.pullTime + 0.20);

    // Snap them in front of us — the tongue is a teleport-grab, not a tow rope.
    // Per-frame velocity pulling was getting clamped by maxVelocity and felt invisible.
    // Clamp to stay on the floor (floor spans roughly x=50..W-50) so grabs near
    // an edge don't deposit the victim off-stage.
    const FLOOR_MARGIN = 90;
    let destX = this.sprite.x + this.facing * 50;
    destX = Math.max(FLOOR_MARGIN, Math.min(W - FLOOR_MARGIN, destX));
    const destY = this.sprite.y;
    this.scene.tweens.add({
      targets: opponent.sprite,
      x: destX, y: destY,
      duration: Math.max(80, sp.pullTime * 1000 - 30),
      ease: "Quad.easeIn",
      onUpdate: () => {
        // Keep the arcade body in sync with the visual sprite during the tween
        if (opponent.sprite.body) opponent.sprite.body.reset(opponent.sprite.x, opponent.sprite.y);
      },
    });

    // Hit flash on victim (no hitstop here — the pull tween would drift out of sync)
    flashFighter(opponent, 0xff99cc, 120);
    spawnBurst(this.scene, opponent.sprite.x, opponent.sprite.y - 10, 0xff99cc, 7, 150);
    spawnDamageNumber(this.scene, opponent.sprite.x, opponent.sprite.y, sp.dmg);
    SFX.play("grabHit");

    // Visual: shrink the grab hitbox to "retract"
    if (this.activeSpecial && this.activeSpecial.hitbox) {
      this.scene.tweens.add({
        targets: this.activeSpecial.hitbox.gfx,
        scaleX: 0.1, duration: sp.pullTime * 1000, ease: "Quad.easeIn",
      });
    }

    // After the pull resolves, pop them up + away so they don't sit inside us
    this.scene.time.delayedCall(sp.pullTime * 1000, () => {
      if (!opponent.sprite || !opponent.sprite.body) return;
      const dir = this.facing;
      const kb = (sp.kbBase + opponent.damage * ATTACK_KB_SCALE) / opponent.stats.weight;
      opponent.sprite.body.setVelocity(dir * kb * 0.55, -kb * 0.5);
    });

    this.scene.cameras.main.shake(120, 0.005);
  }

  // ---- Standard light-attack hit --------------------------------------------

  applyHit(opponent, hb) {
    const s = this.stats;
    const variant = hb ? hb.variant : "jab";
    const chargeMult = hb ? hb.chargeMult : 1;
    const dashMult = this.dashHit ? 1.25 : 1.0;
    // Power Star: 1.5x damage + knockback while active
    const powerMult = (this.scene.time.now / 1000) < (this.powerUntil || 0) ? 1.5 : 1.0;
    const dmg = s.attackDmg * (hb ? hb.dmgMult : 1) * chargeMult * dashMult * powerMult;
    if (opponent.tryDefend(this, dmg, "attack")) return;
    opponent.damage += dmg;
    this.damageDealt += dmg;
    const t = this.scene.time.now / 1000;
    const dir = Math.sign(opponent.sprite.x - this.sprite.x) || this.facing;
    // Knockback scales with victim's accumulated damage, divided by victim's weight.
    const rawKb = (s.attackKbBase + opponent.damage * ATTACK_KB_SCALE)
                  * (hb ? hb.kbMult : 1) * chargeMult * dashMult * powerMult;
    const kb = rawKb / opponent.stats.weight;
    // Launch vector depends on the attack variant
    let vx = dir * kb, vy = -kb * 0.55;
    let label = this.dashHit ? "DASH!" : null;
    if (variant === "up") {
      vx = dir * kb * 0.3; vy = -kb * 1.05;             // straight-up launcher
    } else if (variant === "downTilt") {
      vx = dir * kb * 0.4; vy = -kb * 0.75;             // pop-up combo starter
    } else if (variant === "spike") {
      const ob = opponent.sprite.body;
      const airborne = !(ob.blocked.down || ob.touching.down);
      if (airborne) { vx = dir * kb * 0.2; vy = kb * 0.9; label = "SPIKE!"; }  // METEOR
      else          { vx = dir * kb * 0.5; vy = -kb * 0.6; }
    } else if (variant === "smash") {
      label = "SMASH!";
    }
    opponent.sprite.body.setVelocity(vx, vy);
    opponent.hitstunUntil = t + (HITSTUN_BASE + opponent.damage * 0.003) / opponent.stats.weight;
    opponent.airJumps = Math.max(opponent.airJumps, 1);

    flashFighter(opponent, 0xffffff, 80);
    this.scene.cameras.main.shake(variant === "smash" ? 200 : 120, variant === "smash" ? 0.009 : 0.005);
    // Juice: hit pause + spark burst + damage number (all scale with the hit)
    this.scene.hitstop(variant === "smash" ? 110 : dmg >= 12 ? 75 : 50);
    const hx = (this.sprite.x + opponent.sprite.x) / 2, hy = opponent.sprite.y - 10;
    spawnBurst(this.scene, hx, hy, variant === "smash" ? 0xffcc44 : 0xffeebb,
               variant === "smash" ? 14 : 8, variant === "smash" ? 260 : 170);
    spawnDamageNumber(this.scene, opponent.sprite.x, opponent.sprite.y, dmg);
    SFX.play(variant === "smash" ? "smashHit" :
             (variant === "spike" || this.dashHit) ? "dashHit" : "hit");
    if (label) this.floatText(label, variant === "smash" ? "#ff9933" :
                                     variant === "spike" ? "#ff88bb" : "#ffe066");
  }

  loseStock() {
    this.stocks -= 1;
    this.damage = 0;
    SFX.play("ko");
    // KO spectacle at the point where they left the screen
    const kx = Math.max(30, Math.min(W - 30, this.sprite.x));
    const ky = Math.max(30, Math.min(H - 30, this.sprite.y));
    spawnBurst(this.scene, kx, ky, this.character.color, 18, 340, 10, 550);
    spawnBurst(this.scene, kx, ky, 0xffffff, 10, 240, 6, 450);
    const flash = this.scene.add.rectangle(W / 2, H / 2, W, H, 0xffffff, 0.45);
    this.scene.tweens.add({ targets: flash, alpha: 0, duration: 260, onComplete: () => flash.destroy() });
    const koTxt = this.scene.add.text(kx, ky, "KO!", {
      fontFamily: "Press Start 2P", fontSize: "52px", color: "#ff5544",
      stroke: "#000000", strokeThickness: 8
    }).setOrigin(0.5).setScale(2.4).setAlpha(0.9);
    this.scene.tweens.add({ targets: koTxt, scale: 1, duration: 160, ease: "Back.easeOut" });
    this.scene.tweens.add({ targets: koTxt, alpha: 0, delay: 550, duration: 300, onComplete: () => koTxt.destroy() });
    this.scene.cameras.main.shake(280, 0.012);
    // Reset all defense/charge state so nothing carries across the respawn
    this.stopShield();
    this.cancelCharge();
    this.shieldHP = 100;
    this.invulnUntil = 0;
    this.rollUntil = 0;
    if (this.stocks > 0) {
      this.sprite.body.setVelocity(0, 0);
      this.sprite.x = this.label === "P1" ? 360 : W - 360;
      this.sprite.y = 80;
      this.hitstunUntil = 0;
      this.airJumps = this.airJumpsMax;
      this.prevBodyBottom = null;
      this.prevX = this.sprite.x;
    } else {
      this.sprite.body.setVelocity(0, 0);
      this.sprite.body.setEnable(false);
      // Linger on the KO frame briefly before hiding (animated sprites only)
      if (this.useSprite) this.sprite.setFrame(5);
      this.scene.time.delayedCall(400, () => {
        if (this.sprite) this.sprite.setVisible(false);
        if (this.eye) this.eye.setVisible(false);
        if (this.tag) this.tag.setVisible(false);
      });
    }
  }
}

// ---- Projectile --------------------------------------------------------------

class Projectile {
  constructor(scene, owner, x, y, vx, vy, sp) {
    this.scene = scene;
    this.owner = owner;
    this.sp = sp;
    this.vx = vx;
    this.vy = vy;
    this.dead = false;
    this.gfx = scene.add.rectangle(x, y, sp.projW, sp.projH, sp.projColor, 1)
      .setStrokeStyle(2, 0x222222);
    if (sp.spin) this.spinTween = scene.tweens.add({
      targets: this.gfx, angle: 360, duration: 400, repeat: -1
    });
    this.trailAt = 0;
  }

  // Returns true when the projectile is done and should be removed.
  tick(dt, opponent) {
    if (this.dead) return true;
    this.vy += (this.sp.gravityY || 0) * dt;
    this.gfx.x += this.vx * dt;
    this.gfx.y += this.vy * dt;

    // Fading trail every ~50ms
    const now = this.scene.time.now;
    if (now > this.trailAt) {
      this.trailAt = now + 50;
      const tr = this.scene.add.rectangle(this.gfx.x, this.gfx.y,
        this.sp.projW * 0.6, this.sp.projH * 0.6, this.sp.projColor, 0.45);
      this.scene.tweens.add({
        targets: tr, alpha: 0, scale: 0.3, duration: 260, onComplete: () => tr.destroy()
      });
    }

    // Hit test against the opponent
    const dx = Math.abs(this.gfx.x - opponent.sprite.x);
    const dy = Math.abs(this.gfx.y - opponent.sprite.y);
    if (dx < (this.gfx.width / 2 + opponent.hitW / 2) &&
        dy < (this.gfx.height / 2 + opponent.hitH / 2)) {
      this.owner.applySpecialHit(opponent, this.sp);
      this.destroy();
      return true;
    }

    // Out of bounds
    if (this.gfx.x < -100 || this.gfx.x > W + 100 || this.gfx.y > DEATH_BOTTOM) {
      this.destroy();
      return true;
    }
    return false;
  }

  destroy() {
    this.dead = true;
    if (this.spinTween) this.spinTween.stop();
    this.gfx.destroy();
  }
}

// ---- HUD ---------------------------------------------------------------------

class HUD {
  constructor(scene, p1, p2) {
    this.scene = scene;
    this.p1 = p1; this.p2 = p2;
    this.p1Card = this.makeCard(140, H - 90, p1);
    this.p2Card = this.makeCard(W - 140, H - 90, p2);
  }

  makeCard(x, y, fighter) {
    const bg = this.scene.add.rectangle(x, y, 200, 110, 0x000000, 0.55).setStrokeStyle(3, fighter.character.accent);
    const swatch = this.scene.add.rectangle(x - 75, y - 22, 36, 36, fighter.character.color).setStrokeStyle(2, 0xffffff);
    const name = this.scene.add.text(x - 50, y - 38, fighter.character.name, {
      fontFamily: "Press Start 2P", fontSize: "12px", color: "#ffffff"
    }).setOrigin(0, 0);
    const dmg = this.scene.add.text(x - 50, y - 18, "0%", {
      fontFamily: "Press Start 2P", fontSize: "26px", color: "#ffe066"
    }).setOrigin(0, 0);
    // Stock pips: one colored square per remaining life
    const pips = [];
    for (let i = 0; i < 3; i++) {
      pips.push(this.scene.add.rectangle(x + 40 + i * 20, y + 30, 13, 13, fighter.character.color)
        .setStrokeStyle(2, fighter.character.accent));
    }
    // Shield meter (thin blue bar under the damage %)
    const shieldBg = this.scene.add.rectangle(x - 50, y + 30, 100, 8, 0x1a2a3a).setOrigin(0, 0.5)
      .setStrokeStyle(1, 0x3a5a7a);
    const shieldFill = this.scene.add.rectangle(x - 49, y + 30, 98, 6, 0x66bbff).setOrigin(0, 0.5);
    return { bg, swatch, name, dmg, pips, shieldFill };
  }

  tick() {
    const t = this.scene.time.now / 1000;
    for (const [card, f] of [[this.p1Card, this.p1], [this.p2Card, this.p2]]) {
      card.dmg.setText(Math.floor(f.damage) + "%");
      card.dmg.setColor(this.dmgColor(f.damage));
      // Danger pulse: above 100% the damage readout throbs
      card.dmg.setScale(f.damage > 100 ? 1 + 0.07 * Math.sin(t * 10) : 1);
      card.pips.forEach((p, i) => p.setVisible(i < f.stocks));
      card.shieldFill.width = 98 * Math.max(0, f.shieldHP) / 100;
      card.shieldFill.fillColor = f.shieldHP < 30 ? 0xff8866 : 0x66bbff;
    }
  }

  dmgColor(d) {
    if (d > 120) return "#ff4040";
    if (d > 70)  return "#ff9933";
    if (d > 30)  return "#ffe066";
    return "#ffffff";
  }
}

// ---- Boot --------------------------------------------------------------------

new Phaser.Game({
  type: Phaser.AUTO,
  parent: "game",
  width: W,
  height: H,
  backgroundColor: "#000",
  physics: {
    default: "arcade",
    arcade: { gravity: { y: GRAVITY }, debug: false }
  },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [TitleScene, SelectScene, BattleScene],
});
