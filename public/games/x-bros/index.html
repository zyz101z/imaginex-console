<script>
// X-Bros — Smash-style 2D platform fighter
// Single player vs CPU. Placeholder rectangles; per-character art comes later.

// =============================================================================
// SoundManager — procedural Web Audio so we don't ship/load any audio files.
// All sounds are short oscillator + envelope combos. Master gain sits at 0.4.
// First play() call lazily creates the context; first user gesture resumes it.
// =============================================================================

class SoundManager {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    // Procedural BGM state
    this.musicTimer = null;
    this.musicGain = null;
    this.musicStep = 0;
    this.nextNoteTime = 0;
  }
  ensure() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  }
  resume() {
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  }
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.4;
  }
  toggleMute() { this.setMuted(!this.muted); return this.muted; }

  // Helper: oscillator with optional pitch sweep.
  // `at` (absolute ctx time) + `dest` (alternate output node) are used by the BGM
  // scheduler; SFX callers leave both unset.
  tone({ type = "square", freqStart, freqEnd, dur = 0.1, volume = 0.3, delay = 0, at = null, dest = null }) {
    if (!this.ctx || this.muted) return;
    const t = (at != null ? at : this.ctx.currentTime) + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, t);
    if (freqEnd && freqEnd !== freqStart) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
    }
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(dest || this.master);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  // Helper: filtered noise burst
  noise({ dur = 0.1, volume = 0.25, filterFreq = 2000, filterQ = 1, type = "bandpass", delay = 0, at = null, dest = null }) {
    if (!this.ctx || this.muted) return;
    const t = (at != null ? at : this.ctx.currentTime) + delay;
    const len = Math.ceil(dur * this.ctx.sampleRate);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = type;
    filter.frequency.value = filterFreq;
    filter.Q.value = filterQ;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(dest || this.master);
    src.start(t);
    src.stop(t + dur + 0.05);
  }

  // ---- Procedural chiptune BGM ----------------------------------------------
  // A 4-bar loop in A minor scheduled with a 350ms lookahead. All routed through
  // musicGain -> master so the M mute still silences everything at once.
  startMusic(bpm = 138, leadIdx = 0) {
    this.ensure();
    this.resume();
    this.bpm = bpm;         // per-stage tempo
    this.leadIdx = leadIdx; // per-stage melody
    if (!this.ctx || this.musicTimer) return;
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.55;   // music sits under the SFX
    this.musicGain.connect(this.master);
    this.musicStep = 0;
    this.nextNoteTime = this.ctx.currentTime + 0.06;
    this.musicTimer = setInterval(() => this.scheduleMusic(), 90);
  }

  stopMusic() {
    if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; }
    if (this.musicGain) { this.musicGain.disconnect(); this.musicGain = null; }
  }

  scheduleMusic() {
    if (!this.ctx || !this.musicGain) return;
    const SPB = 60 / (this.bpm || 138) / 2;  // one 8th note
    while (this.nextNoteTime < this.ctx.currentTime + 0.35) {
      this.playMusicStep(this.musicStep, this.nextNoteTime);
      this.musicStep = (this.musicStep + 1) % 64;
      this.nextNoteTime += SPB;
    }
  }

  playMusicStep(step, t) {
    const midi = m => 440 * Math.pow(2, (m - 69) / 12);
    const g = this.musicGain;
    const SPB = 60 / (this.bpm || 138) / 2;
    // Bass: 2-bar riff, repeats (A - C - G - F walk)
    const BASS = [45, 45, 57, 45, 48, 48, 45, 45,   43, 43, 55, 43, 41, 41, 43, 44];
    const b = BASS[step % BASS.length];
    this.tone({ type: "triangle", freqStart: midi(b), dur: SPB * 0.92, volume: 0.26, at: t, dest: g });
    // Leads: three 4-bar melodies (0 = rest), all A minor pentatonic — picked per stage
    const LEADS = [
      [ // 0 — driving (Plains / Rooftop)
        69, 0, 72, 0, 74, 0, 72, 74,   76, 0, 74, 72, 69, 0, 0, 0,
        67, 0, 69, 0, 72, 0, 69, 72,   74, 0, 72, 69, 67, 0, 0, 0,
        69, 0, 72, 0, 74, 0, 76, 0,    79, 0, 76, 74, 76, 0, 0, 0,
        81, 0, 79, 76, 74, 0, 72, 74,  69, 0, 0, 0, 0, 0, 64, 67,
      ],
      [ // 1 — moody, sparse (Peaks / Cavern)
        69, 0, 0, 67, 69, 0, 72, 0,    0, 0, 74, 0, 72, 0, 69, 0,
        64, 0, 0, 67, 69, 0, 0, 0,     72, 0, 69, 0, 67, 0, 0, 0,
        69, 0, 0, 67, 69, 0, 74, 0,    0, 0, 76, 0, 74, 0, 72, 0,
        79, 0, 76, 0, 74, 0, 72, 0,    69, 0, 0, 0, 67, 0, 64, 0,
      ],
      [ // 2 — bouncy syncopation (Sunset)
        0, 69, 0, 72, 0, 74, 74, 0,    72, 0, 69, 0, 72, 72, 0, 0,
        0, 67, 0, 69, 0, 72, 72, 0,    69, 0, 67, 0, 69, 69, 0, 0,
        0, 69, 0, 72, 0, 76, 76, 0,    74, 0, 72, 0, 74, 74, 0, 0,
        0, 79, 0, 76, 0, 74, 72, 0,    69, 0, 72, 0, 69, 0, 0, 0,
      ],
    ];
    const l = LEADS[this.leadIdx || 0][step];
    if (l) this.tone({ type: "square", freqStart: midi(l), dur: SPB * 0.85, volume: 0.085, at: t, dest: g });
    // Drums: kick on the beat, snare on 2 & 4, hats on off-8ths
    if (step % 8 === 0) this.tone({ type: "sine", freqStart: 130, freqEnd: 45, dur: 0.09, volume: 0.34, at: t, dest: g });
    if (step % 8 === 4) this.noise({ dur: 0.07, volume: 0.13, filterFreq: 1900, filterQ: 0.9, at: t, dest: g });
    if (step % 2 === 1) this.noise({ dur: 0.03, volume: 0.05, filterFreq: 7000, filterQ: 1, type: "highpass", at: t, dest: g });
  }

  play(name) {
    this.ensure();
    this.resume();
    if (this.muted || !this.ctx) return;
    switch (name) {
      case "jump":
        this.tone({ type: "square",   freqStart: 240, freqEnd: 520, dur: 0.10, volume: 0.30 }); break;
      case "doubleJump":
        this.tone({ type: "triangle", freqStart: 380, freqEnd: 760, dur: 0.10, volume: 0.30 }); break;
      case "attack":
        this.noise({ dur: 0.06, volume: 0.22, filterFreq: 1200, filterQ: 2 }); break;
      case "hit":
        this.tone({ type: "sine",   freqStart: 90, freqEnd: 35, dur: 0.16, volume: 0.55 });
        this.noise({ dur: 0.05, volume: 0.22, filterFreq: 800, filterQ: 1 });
        break;
      case "dashHit":
        this.tone({ type: "sine",   freqStart: 110, freqEnd: 40, dur: 0.18, volume: 0.6 });
        this.noise({ dur: 0.08, volume: 0.3, filterFreq: 1100, filterQ: 1 });
        this.tone({ type: "square", freqStart: 660, freqEnd: 220, dur: 0.10, volume: 0.18 });
        break;
      case "ko":
        this.tone({ type: "square", freqStart: 480, freqEnd: 80, dur: 0.55, volume: 0.4 });
        this.noise({ dur: 0.4, volume: 0.18, filterFreq: 600, filterQ: 0.8, delay: 0.05 });
        break;
      case "victory":
        // C-E-G arpeggio
        this.tone({ type: "triangle", freqStart: 523, dur: 0.12, volume: 0.35 });
        this.tone({ type: "triangle", freqStart: 659, dur: 0.12, volume: 0.35, delay: 0.10 });
        this.tone({ type: "triangle", freqStart: 784, dur: 0.22, volume: 0.40, delay: 0.20 });
        break;
      case "matchStart":
        this.tone({ type: "square", freqStart: 440, dur: 0.08, volume: 0.30 });
        this.tone({ type: "square", freqStart: 660, dur: 0.08, volume: 0.30, delay: 0.08 });
        this.tone({ type: "square", freqStart: 880, dur: 0.14, volume: 0.35, delay: 0.16 });
        break;
      case "select":
        this.tone({ type: "triangle", freqStart: 600, dur: 0.04, volume: 0.18 }); break;
      case "confirm":
        this.tone({ type: "square", freqStart: 660, dur: 0.06, volume: 0.30 });
        this.tone({ type: "square", freqStart: 990, dur: 0.06, volume: 0.30, delay: 0.05 });
        break;
      case "projectile":
        this.tone({ type: "square", freqStart: 800, freqEnd: 1600, dur: 0.08, volume: 0.20 }); break;
      case "lunge":
        this.noise({ dur: 0.16, volume: 0.20, filterFreq: 1400, filterQ: 0.7 });
        this.tone({ type: "sawtooth", freqStart: 220, freqEnd: 440, dur: 0.16, volume: 0.18 });
        break;
      case "grab":
        this.tone({ type: "sawtooth", freqStart: 280, freqEnd: 80, dur: 0.20, volume: 0.30 }); break;
      case "grabHit":
        this.tone({ type: "square", freqStart: 90, freqEnd: 60, dur: 0.18, volume: 0.4 });
        this.noise({ dur: 0.08, volume: 0.18, filterFreq: 600, filterQ: 1, delay: 0.04 });
        break;
      case "shieldOn":
        this.tone({ type: "sine", freqStart: 300, freqEnd: 520, dur: 0.07, volume: 0.16 }); break;
      case "shieldHit":
        this.tone({ type: "triangle", freqStart: 520, freqEnd: 260, dur: 0.09, volume: 0.3 });
        this.noise({ dur: 0.04, volume: 0.12, filterFreq: 2400, filterQ: 2 });
        break;
      case "shieldBreak":
        this.tone({ type: "square", freqStart: 900, freqEnd: 90, dur: 0.5, volume: 0.42 });
        this.noise({ dur: 0.3, volume: 0.22, filterFreq: 1200, filterQ: 0.8, delay: 0.03 });
        break;
      case "roll":
        this.noise({ dur: 0.12, volume: 0.15, filterFreq: 900, filterQ: 0.7 });
        this.tone({ type: "sine", freqStart: 220, freqEnd: 90, dur: 0.12, volume: 0.14 });
        break;
      case "chargeFull":
        this.tone({ type: "square", freqStart: 660, freqEnd: 880, dur: 0.09, volume: 0.2 }); break;
      case "smashHit":
        this.tone({ type: "sine", freqStart: 130, freqEnd: 38, dur: 0.24, volume: 0.65 });
        this.noise({ dur: 0.1, volume: 0.34, filterFreq: 1000, filterQ: 1 });
        this.tone({ type: "square", freqStart: 880, freqEnd: 180, dur: 0.14, volume: 0.2 });
        break;
    }
  }
}

    platforms: [{ x: W / 2, y: 430, w: 480 }] },
];

class TitleScene extends Phaser.Scene {
  constructor() { super("title"); }
  preload() {
    if (!this.textures.exists("bg_title")) this.load.image("bg_title", "bg/bg_title.png");
  }
  create() {
    this.cameras.main.setBackgroundColor("#08101e");
    const cx = W / 2;
    // Full-bleed key art with the LOGO BAKED INTO THE PAINTING: Meshy painted the
    // "X-BROS / IMAGINEX SMASH" lettering (comic gold, fire sparks) on a green
    // screen; a Python compositor keyed it out and blended it into the art with
    // a drop shadow. No engine-drawn title text — it's all one image now.
    // (Static on purpose: any zoom/drift would crop the baked-in logo.)
    if (this.textures.exists("bg_title")) {
      this.add.image(cx, H / 2, "bg_title").setDisplaySize(W, H);
    }

    // Bottom pill so the prompt reads over the busy art
    this.add.rectangle(cx, 686, 420, 44, 0x0a1220, 0.65).setStrokeStyle(2, 0x3a5a8a);
    const press = this.add.text(cx, 686, "PRESS ENTER", {
      fontFamily: "Press Start 2P", fontSize: "20px", color: "#ffffff"
    }).setOrigin(0.5);
    this.tweens.add({ targets: press, alpha: 0.35, duration: 600, yoyo: true, repeat: -1 });

    this.input.keyboard.once("keydown-ENTER", () => {
      SFX.play("confirm");
      this.scene.start("select");
    });
  }
}

// ---- Character select --------------------------------------------------------

class SelectScene extends Phaser.Scene {
  constructor() { super("select"); }

  preload() {
    // Same sprite loading as BattleScene so portraits can show real art.
    // We only load the raw image here; chroma-keying happens once in create.
    if (!this.textures.exists("bg_title")) this.load.image("bg_title", "bg/bg_title.png");
    for (const c of ROSTER) {
      if (c.sprite && c.sprite.sheet && !this.textures.exists(c.id + "_raw") && !this.textures.exists(c.id)) {
        this.load.image(c.id + "_raw", c.sprite.sheet);
      }
    }
  }

  create() {
    BattleScene.prototype.buildSpriteSheets.call(this);  // reuse the chroma-key + slice

    this.cameras.main.setBackgroundColor("#0a1428");
    const cx = W / 2;
    // Dimmed title painting keeps the menus in one visual world
    if (this.textures.exists("bg_title")) {
      this.add.image(cx, H / 2, "bg_title").setDisplaySize(W, H);
      this.add.rectangle(cx, H / 2, W, H, 0x0a1428, 0.72);
    }
    this.add.text(cx, 60, "PICK YOUR FIGHTER", {
      fontFamily: "Press Start 2P", fontSize: "32px", color: "#9ad6ff"
    }).setOrigin(0.5);
    this.add.text(cx, 110, "Arrows: choose   Up/Down: difficulty   T: vs CPU / 2P   Z or Enter: fight   Esc: back", {
      fontFamily: "Press Start 2P", fontSize: "10px", color: "#aabbdd"
    }).setOrigin(0.5);
    this.add.text(cx, 132, "P1: Arrows + Z atk (hold=SMASH, +Up/Dn=tilts) X special C shield/roll   P2: WASD + F/G/H   M mute  P pause", {
      fontFamily: "Press Start 2P", fontSize: "9px", color: "#7788aa"
    }).setOrigin(0.5);

    // Roster grid (single row; sized so 8 cards fit in 1280)
    const slotW = 130, slotH = 200, gap = 14;
    const total = ROSTER.length * slotW + (ROSTER.length - 1) * gap;
    const x0 = cx - total / 2 + slotW / 2;
    this.cards = ROSTER.map((c, i) => {
      const x = x0 + i * (slotW + gap), y = 280;
      const bg = this.add.rectangle(x, y, slotW, slotH, 0x111c30).setStrokeStyle(3, 0x2a3d60);

      // If we have art, show the idle frame; otherwise the original color swatch.
      let portrait;
      if (c.sprite && this.textures.exists(c.id)) {
        // Tinted backdrop tile so the sprite reads against the dark card
        this.add.rectangle(x, y - 20, slotW - 30, 110, c.color, 0.18).setStrokeStyle(3, c.accent);
        portrait = this.add.sprite(x, y - 20, c.id, 0);
        const aspect = c.sprite.frameW / c.sprite.frameH;
        const maxH = 100, maxW = slotW - 40;
        const dH = Math.min(maxH, maxW / aspect);
        portrait.setDisplaySize(dH * aspect, dH);
      } else {
        portrait = this.add.rectangle(x, y - 20, slotW - 30, 110, c.color).setStrokeStyle(3, c.accent);
      }

      const name = this.add.text(x, y + 60, c.name, {
        fontFamily: "Press Start 2P", fontSize: "11px", color: "#ffffff",
        align: "center", wordWrap: { width: slotW - 10 }
      }).setOrigin(0.5, 0);
      return { bg, portrait, name, x, y };
    });

    // P1 cursor + selected info
    this.p1Index = 0;
    this.cursor = this.add.rectangle(0, 0, slotW + 12, slotH + 12)
      .setStrokeStyle(4, 0xffe066).setFillStyle();
    this.charName = this.add.text(cx, 440, "", {
      fontFamily: "Press Start 2P", fontSize: "24px", color: "#ffe066"
    }).setOrigin(0.5);
    this.charBlurb = this.add.text(cx, 478, "", {
      fontFamily: "Press Start 2P", fontSize: "12px", color: "#ffffff"
    }).setOrigin(0.5);
    this.statText = this.add.text(cx, 520, "", {
      fontFamily: "Press Start 2P", fontSize: "10px", color: "#aabbdd",
      align: "center"
    }).setOrigin(0.5, 0);

    // Mode + difficulty selector
    this.mode = "cpu";       // "cpu" | "2p"
    this.pickPhase = 1;      // 2p: 1 = P1 picking, 2 = P2 picking
    this.p1Pick = 0;
    this.modeLabel = this.add.text(cx, 585, "", {
      fontFamily: "Press Start 2P", fontSize: "13px", color: "#9ad6ff"
    }).setOrigin(0.5);
    this.difficulty = "Normal";
    this.difficultyLabel = this.add.text(cx, 618, "", {
      fontFamily: "Press Start 2P", fontSize: "20px", color: "#ffffff"
    }).setOrigin(0.5);
    this.add.text(cx, 648, "[Up / Down]  [T: mode]", {
      fontFamily: "Press Start 2P", fontSize: "10px", color: "#778899"
    }).setOrigin(0.5);

    this.refresh();

    // Inputs
    const k = this.input.keyboard;
    this.keyLeft = k.addKey("LEFT");
    this.keyRight = k.addKey("RIGHT");
    this.keyUp = k.addKey("UP");
    this.keyDown = k.addKey("DOWN");
    this.keyConfirm = k.addKey("Z");
    this.keyEnter = k.addKey("ENTER");
    // Require each confirm key to be RELEASED once before it can start a fight,
    // so a held Enter from the title screen can't skip straight past us.
    this.enterArmed = false;
    this.confirmArmed = false;
    this.keyMode = k.addKey("T");
    k.on("keydown-ESC", () => {
      if (this.mode === "2p" && this.pickPhase === 2) {
        // Back out of P2's pick, not all the way to the title
        this.pickPhase = 1;
        this.p1Index = this.p1Pick;
        this.cursor.setStrokeStyle(4, 0xffe066);
        this.refresh();
      } else {
        this.scene.start("title");
      }
    });
  }

  refresh() {
    const card = this.cards[this.p1Index];
    this.cursor.x = card.x;
    this.cursor.y = card.y;
    const c = ROSTER[this.p1Index];
    this.charName.setText((this.mode === "2p" ? (this.pickPhase === 2 ? "P2: " : "P1: ") : "") + c.name);
    this.charBlurb.setText(c.blurb);
    const s = c.stats;
    this.statText.setText(
      `Weight ${s.weight.toFixed(2)}   Speed ${s.walkSpeed}   Jump ${-s.jumpVel}\n` +
      `Damage ${s.attackDmg}   Reach ${s.attackRange}   Cooldown ${s.attackCooldown}s\n` +
      `Special [X]: ${c.special ? c.special.name : "—"}`
    );
    this.modeLabel.setText(this.mode === "2p"
      ? (this.pickPhase === 2 ? "MODE: 2 PLAYERS — P2 PICK!" : "MODE: 2 PLAYERS")
      : "MODE: VS CPU");
    if (this.mode === "2p") {
      this.difficultyLabel.setText("P2: WASD + F/G/H");
      this.difficultyLabel.setColor("#9ad6ff");
    } else {
      this.difficultyLabel.setText(`CPU: ${this.difficulty.toUpperCase()}`);
      this.difficultyLabel.setColor(
        this.difficulty === "Easy" ? "#7be680" :
        this.difficulty === "Hard" ? "#ff7a7a" : "#ffe066"
      );
    }
  }

  update() {
    let changed = false;
    if (Phaser.Input.Keyboard.JustDown(this.keyLeft)) {
      this.p1Index = (this.p1Index - 1 + ROSTER.length) % ROSTER.length;
      changed = true;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keyRight)) {
      this.p1Index = (this.p1Index + 1) % ROSTER.length;
      changed = true;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keyUp) && this.mode === "cpu") {
      this.difficulty = nextDiff(this.difficulty, +1);
      changed = true;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keyDown) && this.mode === "cpu") {
      this.difficulty = nextDiff(this.difficulty, -1);
      changed = true;
    }
    if (Phaser.Input.Keyboard.JustDown(this.keyMode)) {
      this.mode = this.mode === "cpu" ? "2p" : "cpu";
      this.pickPhase = 1;
      this.cursor.setStrokeStyle(4, 0xffe066);
      changed = true;
    }
    if (changed) {
      SFX.play("select");
      this.refresh();
    }

    if (!this.keyEnter.isDown) this.enterArmed = true;
    if (!this.keyConfirm.isDown) this.confirmArmed = true;
    // Always call JustDown so a stale press is consumed even while unarmed.
    const confirmPressed = Phaser.Input.Keyboard.JustDown(this.keyConfirm);
    const enterPressed = Phaser.Input.Keyboard.JustDown(this.keyEnter);
    if ((confirmPressed && this.confirmArmed) || (enterPressed && this.enterArmed)) {
      SFX.play("confirm");
      if (this.mode === "2p" && this.pickPhase === 1) {
        // P1 locked in — same cursor now picks for P2 (red ring)
        this.p1Pick = this.p1Index;
        this.pickPhase = 2;
        this.cursor.setStrokeStyle(4, 0xff6666);
        this.confirmArmed = false;
        this.enterArmed = false;
        this.refresh();
      } else if (this.mode === "2p") {
        this.scene.start("battle", {
          p1: ROSTER[this.p1Pick],
          p2: ROSTER[this.p1Index],   // mirror matches allowed
          difficulty: this.difficulty,
          mode: "2p",
        });
      } else {
        // Pick a CPU character at random, but never the same as P1
        const otherIdx = pickOtherIndex(this.p1Index);
        this.scene.start("battle", {
          p1: ROSTER[this.p1Index],
          p2: ROSTER[otherIdx],
          difficulty: this.difficulty,
          mode: "cpu",
        });
      }
    }
  }
}

function nextDiff(cur, dir) {
  const order = ["Easy", "Normal", "Hard"];
  let i = order.indexOf(cur);
  i = (i + dir + order.length) % order.length;
  return order[i];
}

function pickOtherIndex(p1Idx) {
  let i = Math.floor(Math.random() * ROSTER.length);
  if (i === p1Idx) i = (i + 1) % ROSTER.length;
  return i;
}

// Items — spawn on stage every ~11-18s, despawn after 9s, pickup by touch.
//   star = 8s of 1.5x damage/knockback   taco = heal 35%   bomb = trap (shield blocks it)
const ITEMS = [
  { key: "star", frame: 0 },
  { key: "taco", frame: 1 },
  { key: "bomb", frame: 2 },
];

// ---- Battle scene ------------------------------------------------------------

class BattleScene extends Phaser.Scene {
  constructor() { super("battle"); }

  init(data) {
    this.p1Char = data.p1 || ROSTER[0];
    this.p2Char = data.p2 || ROSTER[1];
    this.difficulty = data.difficulty || "Normal";
    this.mode = data.mode || "cpu";        // "cpu" | "2p"
    // Pick the stage here (before preload) so we only fetch this stage's backdrop
    this.stageDef = STAGES[Math.floor(Math.random() * STAGES.length)];
  }

  preload() {
    // Load any character sprite sheets that haven't been loaded yet.
    // Loaded as plain images first; we chroma-key the white background out in create().
    for (const c of ROSTER) {
      if (c.sprite && c.sprite.sheet && !this.textures.exists(c.id + "_raw") && !this.textures.exists(c.id)) {
        this.load.image(c.id + "_raw", c.sprite.sheet);
      }
    }
    // Stage backdrop painting (Meshy-generated). Missing file → load error →
    // texture never exists → create() falls back to the procedural backdrop.
    const st = this.stageDef;
    if (st.bg && !this.textures.exists("bg_" + st.id)) {
      this.load.image("bg_" + st.id, st.bg);
    }
    // Item icons (star/taco/bomb). Missing → rectangle fallback in spawnItem.
    if (!this.textures.exists("items")) {
      this.load.spritesheet("items", "sprites/items.png", { frameWidth: 170, frameHeight: 170 });
    }
  }

  // Convert near-white pixels to transparent and register a spritesheet texture
  // under the character's id (e.g. "berserker"). One-time work per scene start.
  buildSpriteSheets() {
    for (const c of ROSTER) {
      if (!c.sprite) continue;
      if (this.textures.exists(c.id)) continue;
      const rawKey = c.id + "_raw";
      if (!this.textures.exists(rawKey)) continue;
      const raw = this.textures.get(rawKey).getSourceImage();
      const canvas = document.createElement("canvas");
      canvas.width = raw.width;
      canvas.height = raw.height;
      const cctx = canvas.getContext("2d");
      cctx.drawImage(raw, 0, 0);
      const imgData = cctx.getImageData(0, 0, canvas.width, canvas.height);
      const px = imgData.data;
      // Pre-keyed detection: if the top row is already transparent, this PNG has
      // real alpha (Wilson/Bigfoot sheets) — chroma-keying would match the black
      // behind the transparency and DELETE the black pixel-art outlines. Skip it.
      const W2 = canvas.width, H2 = canvas.height;
      let clearCount = 0;
      for (let i = 0; i < 32; i++) {
        const x = Math.floor((W2 - 1) * i / 31);
        if (px[x * 4 + 3] < 10) clearCount++;
      }
      const preKeyed = clearCount >= 29;
      if (!preKeyed) {
      // Chroma-key strategy: sample MANY pixels along the top row of the image
      // (almost always above the characters' heads = pure background) and cluster
      // them. The top 1-2 clusters are real background colors. This handles:
      //   - single-color bg (most images)
      //   - checkerboard "transparent" backgrounds (two-tone, Steve)
      //   - and refuses to mistake corner-character-pixels for bg (Jimmy's KO
      //     body in the bottom-right corner was being keyed as black before).
      const SAMPLES = 32;
      const distSq = (a, b) => {
        const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
        return dr * dr + dg * dg + db * db;
      };
      const TH = 35 * 35;
      const samples = [];
      for (let i = 0; i < SAMPLES; i++) {
        const x = Math.floor((W2 - 1) * i / (SAMPLES - 1));
        const idx = x * 4;
        samples.push([px[idx], px[idx + 1], px[idx + 2]]);
      }
      // Cluster samples by color proximity
      const clusters = [];
      for (const s of samples) {
        let matched = false;
        for (const c of clusters) {
          if (distSq(c.center, s) < TH) { c.count++; matched = true; break; }
        }
        if (!matched) clusters.push({ center: s, count: 1 });
      }
      clusters.sort((a, b) => b.count - a.count);
      // Keep only clusters that captured at least 3 of the 32 samples (≥10% of
      // top edge). Cap at 2 bg colors so we never key too aggressively.
      const bgs = clusters.filter(c => c.count >= 3).slice(0, 2).map(c => c.center);
      if (bgs.length === 0) bgs.push(samples[0]);  // fallback
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i + 1], b = px[i + 2];
        for (let k = 0; k < bgs.length; k++) {
          const bg = bgs[k];
          const dr = r - bg[0], dg = g - bg[1], db = b - bg[2];
          if (dr * dr + dg * dg + db * db < TH) { px[i + 3] = 0; break; }
        }
      }
      }  // end !preKeyed
      // Optional frame-edge trim: forces a transparent gutter on each frame slot
      // to kill content that bleeds in from adjacent frames (Chad's racket
      // overhead in frame 2 was showing up in front of frame 1's walking face).
      if (c.sprite.frameTrim) {
        const trim = c.sprite.frameTrim;
        const fw = c.sprite.frameW;
        const fh = c.sprite.frameH;
        const nFrames = Math.floor(W2 / fw);
        for (let fi = 0; fi < nFrames; fi++) {
          const leftX = fi * fw;
          const rightX = (fi + 1) * fw;
          for (let dx = 0; dx < trim; dx++) {
            for (let y = 0; y < fh; y++) {
              px[(y * W2 + leftX + dx) * 4 + 3] = 0;
              px[(y * W2 + rightX - 1 - dx) * 4 + 3] = 0;
            }
          }
        }
      }
      cctx.putImageData(imgData, 0, 0);
      this.textures.addSpriteSheet(c.id, canvas, {
        frameWidth: c.sprite.frameW,
        frameHeight: c.sprite.frameH,
      });
    }
  }

  create() {
    this.buildSpriteSheets();
    const st = this.stageDef;  // picked in init() so preload could fetch its art

    // Backdrop: Meshy-painted stage art when loaded, procedural fallback otherwise
    if (st.bg && this.textures.exists("bg_" + st.id)) {
      this.add.image(W / 2, H / 2, "bg_" + st.id).setDisplaySize(W, H);
      // Subtle scrim so fighters + HUD stay readable over the painting
      this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.18);
    } else {
      const bg = this.add.graphics();
      bg.fillGradientStyle(st.bgTop, st.bgTop, st.bgBot, st.bgBot, 1);
      bg.fillRect(0, 0, W, H);

      // Distant mountains for depth
      const mtn = this.add.graphics();
      mtn.fillStyle(st.mtn, 1);
      mtn.fillTriangle(0, 600, 320, 280, 640, 600);
      mtn.fillTriangle(420, 600, 800, 320, 1180, 600);
      mtn.fillTriangle(900, 600, 1200, 360, 1500, 600);
      mtn.fillStyle(st.haze, 0.55);
      mtn.fillRect(0, 600, W, 200);
    }

    // Stage: main floor (same footprint everywhere) + per-stage platforms.
    // Physics rectangles are invisible; the themed decor is drawn on top.
    this.stage = this.physics.add.staticGroup();
    const floor = this.add.rectangle(W / 2, GROUND_Y + 40, W - 100, 80, st.floor).setVisible(false);
    this.physics.add.existing(floor, true);
    this.stage.add(floor);
    this.drawSlab(st, W / 2, GROUND_Y + 40, W - 100, 80, st.floor, st.floorEdge);

    for (const p of st.platforms) {
      const platform = this.add.rectangle(p.x, p.y, p.w, 24, st.plat).setVisible(false);
      this.physics.add.existing(platform, true);
      this.stage.add(platform);
      this.drawSlab(st, p.x, p.y, p.w, 24, st.plat, st.platEdge);
    }

    // Stage-name banner, fades out after a beat
    const banner = this.add.text(W / 2, 130, st.name, {
      fontFamily: "Press Start 2P", fontSize: "26px", color: "#ffffff",
      stroke: "#000000", strokeThickness: 6
    }).setOrigin(0.5).setAlpha(0.95);
    this.tweens.add({ targets: banner, alpha: 0, delay: 1300, duration: 600, onComplete: () => banner.destroy() });

    // Mode / difficulty label (top center)
    this.add.text(W / 2, 24,
      this.mode === "2p" ? "2 PLAYER VS" : `CPU: ${this.difficulty.toUpperCase()}`, {
      fontFamily: "Press Start 2P", fontSize: "14px",
      color: this.mode === "2p" ? "#9ad6ff" :
             this.difficulty === "Easy" ? "#7be680" :
             this.difficulty === "Hard" ? "#ff7a7a" : "#ffe066"
    }).setOrigin(0.5);

    // Fighters
    this.p1 = new Fighter(this, 360, 400, this.p1Char, "P1");
    this.p2 = new Fighter(this, W - 360, 400, this.p2Char, "P2");
    this.physics.add.collider(this.p1.sprite, this.stage);
    this.physics.add.collider(this.p2.sprite, this.stage);

    this.hud = new HUD(this, this.p1, this.p2);

    // Off-screen indicators: a colored arrow at the top edge tracks a launched fighter
    this.offArrows = [this.p1, this.p2].map(f =>
      this.add.triangle(0, 18, 0, 22, 11, 0, 22, 22, f.character.color, 0.95)
        .setStrokeStyle(2, 0xffffff).setVisible(false));

    // Inputs — P1 is arrows+ZXC; P2 is WASD+FGH in 2-player mode, CPU otherwise
    const k = this.input.keyboard;
    this.p1Keys = {
      left: k.addKey("LEFT"), right: k.addKey("RIGHT"), up: k.addKey("UP"),
      down: k.addKey("DOWN"), attack: k.addKey("Z"), special: k.addKey("X"),
      shield: k.addKey("C")
    };
    this.p1Controller = new HumanController(this.p1Keys);
    if (this.mode === "2p") {
      this.p2Keys = {
        left: k.addKey("A"), right: k.addKey("D"), up: k.addKey("W"),
        down: k.addKey("S"), attack: k.addKey("F"), special: k.addKey("G"),
        shield: k.addKey("H")
      };
      this.p2Controller = new HumanController(this.p2Keys);
    } else {
      this.p2Controller = new CpuController(this.p2, this.p1, DIFFICULTY[this.difficulty]);
    }

    this.gameOver = false;
    this.hitstopUntil = 0;
    this.items = [];
    this.nextItemAt = this.time.now + 9000 + Math.random() * 6000;

    // READY... GO! intro — inputs held until GO
    this.introUntil = this.time.now + 1300;
    const ready = this.add.text(W / 2, H / 2 - 60, "READY...", {
      fontFamily: "Press Start 2P", fontSize: "44px", color: "#ffe066",
      stroke: "#000000", strokeThickness: 8
    }).setOrigin(0.5).setScale(0.2);
    this.tweens.add({ targets: ready, scale: 1, duration: 180, ease: "Back.easeOut" });
    this.time.delayedCall(800, () => {
      ready.setText("GO!").setColor("#7be680").setScale(0.2);
      this.tweens.add({ targets: ready, scale: 1.3, duration: 150, ease: "Back.easeOut" });
      this.tweens.add({ targets: ready, alpha: 0, delay: 350, duration: 250, onComplete: () => ready.destroy() });
    });

    SFX.play("matchStart");
    SFX.startMusic(st.bpm, st.lead || 0);
    // Covers ESC-to-roster AND endMatch restart (shutdown fires before create re-runs)
    this.events.once("shutdown", () => SFX.stopMusic());

    k.on("keydown-ESC", () => this.scene.start("select"));
    // P pauses (handy mid-match in a living room)
    this.userPaused = false;
    this.pauseOverlay = null;
    k.on("keydown-P", () => {
      if (this.gameOver) return;
      this.userPaused = !this.userPaused;
      if (this.userPaused) {
        this.pauseOverlay = this.add.container(0, 0, [
          this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.55),
          this.add.text(W / 2, H / 2 - 20, "PAUSED", {
            fontFamily: "Press Start 2P", fontSize: "44px", color: "#ffe066",
            stroke: "#000000", strokeThickness: 8
          }).setOrigin(0.5),
          this.add.text(W / 2, H / 2 + 40, "P = resume    ESC = quit to roster", {
            fontFamily: "Press Start 2P", fontSize: "13px", color: "#ffffff"
          }).setOrigin(0.5),
        ]);
      } else if (this.pauseOverlay) {
        this.pauseOverlay.destroy();
        this.pauseOverlay = null;
      }
    });
    k.on("keydown-M", () => {
      const muted = SFX.toggleMute();
      const txt = this.add.text(W / 2, 60, muted ? "SOUND OFF" : "SOUND ON", {
        fontFamily: "Press Start 2P", fontSize: "16px", color: "#ffe066"
      }).setOrigin(0.5);
      this.tweens.add({ targets: txt, alpha: 0, duration: 800, onComplete: () => txt.destroy() });
    });
  }

  // Themed slab renderer — floors and platforms share it. Deterministic detail
  // placement (multiplicative hashing, no RNG) so nothing shimmers between draws.
  drawSlab(st, x, y, w, h, bodyColor, edgeColor) {
    const g = this.add.graphics();
    const left = x - w / 2, top = y - h / 2;
    // Body with a darker lower half for depth
    g.fillStyle(bodyColor, 1);
    g.fillRect(left, top, w, h);
    g.fillStyle(0x000000, 0.25);
    g.fillRect(left, top + h * 0.55, w, h * 0.45);
    // Bright top lip
    g.fillStyle(edgeColor, 1);
    g.fillRect(left, top, w, 5);
    // Rough side edges
    g.fillStyle(0x000000, 0.3);
    g.fillRect(left, top + 5, 4, h - 5);
    g.fillRect(left + w - 4, top + 5, 4, h - 5);

    if (st.theme === "earth") {
      // Grass blanket + tufts along the lip, dirt speckles in the body
      const grass = st.grass || 0x5fae52;
      g.fillStyle(grass, 1);
      g.fillRect(left, top, w, 8);
      for (let gx = left + 4; gx < left + w - 10; gx += 22) {
        const th = 6 + (Math.floor(gx * 7.13) % 7);
        g.fillTriangle(gx, top + 1, gx + 5, top - th, gx + 10, top + 1);
      }
      g.fillStyle(0x000000, 0.18);
      for (let i = 0; i < w / 26; i++) {
        const sx = left + 10 + ((i * 137) % Math.max(20, w - 24));
        const sy = top + 14 + ((i * 71) % Math.max(6, h - 22));
        g.fillRect(sx, sy, 6, 3);
      }
    } else if (st.theme === "stone") {
      // Block seams + cracks
      g.lineStyle(2, 0x000000, 0.28);
      for (let gx = left + 46; gx < left + w - 20; gx += 92) {
        g.lineBetween(gx, top + 5, gx, top + h - 2);
      }
      if (h > 40) g.lineBetween(left + 4, top + h * 0.55, left + w - 4, top + h * 0.55);
      g.lineStyle(2, 0xffffff, 0.10);
      for (let i = 0; i < w / 90; i++) {
        const sx = left + 30 + ((i * 211) % Math.max(30, w - 60));
        g.lineBetween(sx, top + 8, sx + 16, top + Math.min(h - 4, 26));
      }
    } else if (st.theme === "metal") {
      // Neon edge glow above + below, rivets, panel seams
      g.fillStyle(edgeColor, 0.20);
      g.fillRect(left - 4, top - 4, w + 8, 4);
      g.fillRect(left - 4, top + h, w + 8, 5);
      g.fillStyle(edgeColor, 1);
      for (let gx = left + 12; gx < left + w - 10; gx += 36) {
        g.fillRect(gx, top + Math.min(h - 8, 12), 4, 4);
      }
      g.lineStyle(2, 0x000000, 0.3);
      for (let gx = left + 60; gx < left + w - 30; gx += 120) {
        g.lineBetween(gx, top + 5, gx, top + h - 2);
      }
    } else if (st.theme === "crystal") {
      // Soft aura + glowing crystal clusters growing off the top
      g.fillStyle(edgeColor, 0.12);
      g.fillRect(left - 6, top - 8, w + 12, h + 14);
      g.fillStyle(edgeColor, 0.9);
      for (let gx = left + 14; gx < left + w - 24; gx += Math.max(58, w / 7)) {
        const ch = 10 + (Math.floor(gx * 3.7) % 12);
        g.fillTriangle(gx, top + 2, gx + 7, top - ch, gx + 14, top + 2);
        g.fillTriangle(gx + 9, top + 2, gx + 14, top - ch * 0.6, gx + 19, top + 2);
      }
    }
    return g;
  }

  // Freeze the action for a few frames — the classic fighting-game hit pause.
  hitstop(ms) {
    this.hitstopUntil = Math.max(this.hitstopUntil, this.time.now + ms);
  }

  update(time, delta) {
    const dt = delta / 1000;
    // User pause (P)
    if (this.userPaused) {
      this.physics.world.isPaused = true;
      return;
    }
    // Hitstop: pause physics + fighter logic, keep HUD/tweens alive
    if (time < this.hitstopUntil) {
      this.physics.world.isPaused = true;
      this.hud.tick();
      return;
    }
    if (this.physics.world.isPaused) this.physics.world.isPaused = false;
    if (!this.gameOver) {
      const intro = time < this.introUntil;
      const p1Input = intro ? zeroInput() : this.p1Controller.poll(dt);
      const p2Input = intro ? zeroInput() : this.p2Controller.poll(dt);
      this.p1.tick(dt, p1Input, this.p2);
      this.p2.tick(dt, p2Input, this.p1);

      // Track fighters launched above the screen
      [this.p1, this.p2].forEach((f, i) => {
        const show = f.stocks > 0 && f.sprite.y < -30;
        this.offArrows[i].setVisible(show);
        if (show) this.offArrows[i].x = Math.max(20, Math.min(W - 20, f.sprite.x)) - 11;
      });

      if (!intro) this.tickItems(time);

      if (this.p1.stocks <= 0 || this.p2.stocks <= 0) this.endMatch();
    }
    this.hud.tick();
  }

  // ---- Items ---------------------------------------------------------------

  spawnItem(time) {
    const def = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    // Spawn spots: anywhere along the floor + on any platform
    const spots = [{ x: 160 + Math.random() * (W - 320), y: GROUND_Y - 44 }];
    for (const p of this.stageDef.platforms) {
      spots.push({ x: p.x - p.w / 2 + 24 + Math.random() * (p.w - 48), y: p.y - 56 });
    }
    const s = spots[Math.floor(Math.random() * spots.length)];
    let gfx;
    if (this.textures.exists("items")) {
      gfx = this.add.sprite(s.x, s.y, "items", def.frame).setDisplaySize(46, 46);
    } else {
      gfx = this.add.rectangle(s.x, s.y, 34, 34,
        def.key === "star" ? 0xffd94a : def.key === "taco" ? 0xd9a04a : 0x222233)
        .setStrokeStyle(2, 0xffffff);
    }
    this.tweens.add({ targets: gfx, y: s.y - 8, duration: 700, yoyo: true, repeat: -1, ease: "Sine.easeInOut" });
    spawnBurst(this, s.x, s.y, 0xffffff, 6, 90, 5, 300);
    SFX.play("select");
    this.items.push({ def, gfx, until: time + 9000 });
  }

  tickItems(time) {
    if (time > this.nextItemAt && this.items.length < 2) {
      this.spawnItem(time);
      this.nextItemAt = time + 11000 + Math.random() * 7000;
    }
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      if (time > it.until) {
        it.gfx.destroy();
        this.items.splice(i, 1);
        continue;
      }
      for (const f of [this.p1, this.p2]) {
        if (f.stocks <= 0) continue;
        if (Math.abs(f.sprite.x - it.gfx.x) < 42 && Math.abs(f.sprite.y - it.gfx.y) < 64) {
          this.applyItem(f, it.def);
          it.gfx.destroy();
          this.items.splice(i, 1);
          break;
        }
      }
    }
  }

  applyItem(f, def) {
    const t = this.time.now / 1000;
    if (def.key === "taco") {
      f.damage = Math.max(0, f.damage - 35);
      f.floatText("+HEAL!", "#7be680");
      spawnBurst(this, f.sprite.x, f.sprite.y - 20, 0x7be680, 8, 140);
      SFX.play("confirm");
    } else if (def.key === "star") {
      f.powerUntil = t + 8;
      f.floatText("POWER UP!", "#ffd94a");
      spawnBurst(this, f.sprite.x, f.sprite.y - 20, 0xffd94a, 12, 200);
      SFX.play("chargeFull");
    } else {
      // Bomb trap — dodge i-frames or a raised shield beat it, otherwise BOOM
      if (f.tryDefend(f, 14, "attack")) return;
      f.damage += 14;
      const dir = Math.random() < 0.5 ? -1 : 1;
      const kb = (320 + f.damage * ATTACK_KB_SCALE) / f.stats.weight;
      f.sprite.body.setVelocity(dir * kb * 0.7, -kb * 0.8);
      f.hitstunUntil = t + 0.35;
      flashFighter(f, 0xffffff, 100);
      spawnBurst(this, f.sprite.x, f.sprite.y - 10, 0xff8844, 16, 300, 9, 500);
      spawnDamageNumber(this, f.sprite.x, f.sprite.y, 14);
      this.hitstop(90);
      this.cameras.main.shake(200, 0.01);
      SFX.play("smashHit");
    }
  }

  endMatch() {
    this.gameOver = true;
    SFX.stopMusic();
    // Clean up in-flight projectiles — tickProjectiles stops running now, so
    // anything mid-air would freeze over the overlay with its spin tween live.
    for (const f of [this.p1, this.p2]) {
      for (const p of f.projectiles) p.destroy();
      f.projectiles.length = 0;
    }
    for (const it of this.items) it.gfx.destroy();
    this.items.length = 0;
    const draw = this.p1.stocks <= 0 && this.p2.stocks <= 0;
    const winner = this.p1.stocks > 0 ? this.p1 : this.p2;
    // Fanfare only when the human wins; CPU wins and draws stay quiet.
    if (!draw && winner === this.p1) SFX.play("victory");
    const cx = W / 2;
    this.add.rectangle(cx, H / 2, W, 300, 0x000000, 0.72);
    // Winner portrait (idle frame) sliding in beside the text
    if (!draw && winner.useSprite && this.textures.exists(winner.character.id)) {
      const sp = winner.character.sprite;
      const port = this.add.sprite(cx - 380, H / 2, winner.character.id, 0);
      const aspect = sp.frameW / sp.frameH;
      port.setDisplaySize(170 * aspect, 170).setAlpha(0);
      this.tweens.add({ targets: port, alpha: 1, x: cx - 340, duration: 250, ease: "Quad.easeOut" });
    }
    this.add.text(cx, H / 2 - 40, draw ? "DRAW!" : `${winner.character.name.toUpperCase()} WINS!`, {
      fontFamily: "Press Start 2P", fontSize: "44px", color: "#ffe066"
    }).setOrigin(0.5);
    this.add.text(cx, H / 2 + 18,
      `${this.p1.character.name} dealt ${Math.floor(this.p1.damageDealt)}%   •   ` +
      `${this.p2.character.name} dealt ${Math.floor(this.p2.damageDealt)}%`, {
      fontFamily: "Press Start 2P", fontSize: "12px", color: "#aabbdd"
    }).setOrigin(0.5);
    this.add.text(cx, H / 2 + 58, "ENTER = rematch    ESC = roster", {
      fontFamily: "Press Start 2P", fontSize: "14px", color: "#ffffff"
    }).setOrigin(0.5);
    this.input.keyboard.once("keydown-ENTER", () =>
      this.scene.restart({ p1: this.p1Char, p2: this.p2Char, difficulty: this.difficulty, mode: this.mode })
    );
  }
}

// ---- Controllers -------------------------------------------------------------

// poll(dt) -> {left, right, up, down, jumpPressed, attackPressed}
// jumpPressed / attackPressed are edge-triggered (one frame per "press").

class HumanController {
  constructor(keys) {
    this.keys = keys;
    // Require Z to be released once so the select-screen confirm press
    // doesn't bleed in as an instant attack on frame 1.
    this.attackArmed = false;
  }
  poll() {
    if (!this.keys.attack.isDown) this.attackArmed = true;
    const attackPressed = Phaser.Input.Keyboard.JustDown(this.keys.attack);
    return {
      left:  this.keys.left.isDown,
      right: this.keys.right.isDown,
      up:    this.keys.up.isDown,
      down:  this.keys.down.isDown,
      jumpPressed:    Phaser.Input.Keyboard.JustDown(this.keys.up),
      attackPressed:  attackPressed && this.attackArmed,
      attackDown:     this.keys.attack.isDown && this.attackArmed,
      attackReleased: Phaser.Input.Keyboard.JustUp(this.keys.attack),
      specialPressed: Phaser.Input.Keyboard.JustDown(this.keys.special),
      shield: this.keys.shield.isDown,
      face: 0,
    };
  }
}

class CpuController {
  constructor(self, opponent, cfg) {
    this.self = self;
    this.opponent = opponent;
    this.cfg = cfg;
    this.attackCooldown = 0;
    this.jumpHeld = false;
    this.attackHeld = false;
    this.specialHeld = false;
    this.nextWiggleAt = 0;
    this.wiggleDir = 0;
    this.reactionAt = 0;          // earliest time we can react to a new in-range opportunity
    // Defensive state: one dice-roll per opponent swing (keyed by attackUntil),
    // resolved into a short shield-hold or a roll away.
    this.lastSwingSeen = 0;
    this.defAction = null;        // {type:'shield'|'roll', until, dir}
    this.chargePlan = null;       // when set: hold Z until this time, then release a smash
  }

  poll(dt) {
    const t = this.self.scene.time.now / 1000;
    const me = this.self.sprite;
    const them = this.opponent.sprite;
    if (this.self.stocks <= 0) return zeroInput();

    const dx = them.x - me.x;
    const dy = them.y - me.y;
    const absDx = Math.abs(dx);
    const myFacingTowardThem = Math.sign(dx) === this.self.facing;
    const cfg = this.cfg;

    let left = false, right = false;
    let wantsJump = false, wantsAttack = false, wantsSpecial = false;

    // Recover toward stage if at the edges
    const offLeft = me.x < 120;
    const offRight = me.x > W - 120;
    if (offLeft)  right = true;
    if (offRight) left  = true;

    // Spacing target = our reach + difficulty buffer.
    // Hard uses a small buffer so the bot crowds in tight where its swings reliably connect.
    const ATTACK_RANGE = this.self.character.stats.attackRange + cfg.rangeBuffer;
    if (!offLeft && !offRight) {
      if (absDx > ATTACK_RANGE + 20) {
        if (dx < 0) left = true; else right = true;
      } else if (!cfg.crowd && absDx < ATTACK_RANGE - 28) {
        // Easy/Normal back off when too close so they don't auto-trade.
        // Hard does NOT back off — it stands in your face.
        if (dx < 0) right = true; else left = true;
      } else if (!cfg.crowd) {
        // Idle wiggle for non-crowding difficulties (less predictable)
        if (t > this.nextWiggleAt) {
          this.wiggleDir = Math.random() < 0.5 ? -1 : 1;
          this.nextWiggleAt = t + 0.4 + Math.random() * 0.6;
        }
        if (this.wiggleDir < 0) left = true; else right = true;
      }
      // crowd=true with no movement input is fine — just stand and swing.
    }

    // Jumping: chase up, recover from off-stage
    const body = me.body;
    const onGround = body.blocked.down || body.touching.down;
    const opponentAbove = dy < -90 && absDx < 280;
    if (opponentAbove && (onGround || (cfg.airChase && this.self.airJumps > 0 && body.velocity.y > -100))) {
      wantsJump = true;
    }
    if (!onGround && me.y > 720 && this.self.airJumps > 0) {
      wantsJump = true;
    }

    // Attack decision. Three modes blend in:
    //   - normal: random chance to swing while in range
    //   - combo:  opponent in hitstun → much higher chance + shorter cooldown
    //   - whiff punish: opponent just attacked and is now in their cooldown → lunge in
    // Tilt windows: opponent floating above us → up-strike; we're airborne with
    // the opponent below → spike. Both extend the base in-range box vertically.
    const upWindow = absDx < ATTACK_RANGE * 0.8 && dy < -60 && dy > -170;
    const spikeWindow = !onGround && absDx < 95 && dy > 60 && dy < 170;
    const inRange = (absDx < ATTACK_RANGE && Math.abs(dy) < 80) || upWindow || spikeWindow;
    const opponentStunned = t < (this.opponent.hitstunUntil || 0);
    const opponentSwinging = t < (this.opponent.attackUntil || 0);
    const opponentRecovering = !opponentSwinging && t < (this.opponent.attackCooldownUntil || 0);

    // ---- Defensive reaction ---------------------------------------------------
    // One dice-roll per opponent swing (keyed by its attackUntil timestamp):
    // either roll away, hold shield for half a second, or do nothing.
    let wantsShield = false;
    if (opponentSwinging && this.opponent.attackUntil !== this.lastSwingSeen) {
      this.lastSwingSeen = this.opponent.attackUntil;
      if (onGround && absDx < ATTACK_RANGE + 90 && !this.defAction) {
        const r = Math.random();
        if (r < cfg.rollChance) {
          this.defAction = { type: "roll", until: t + 0.1, dir: -Math.sign(dx) || 1 };
        } else if (r < cfg.rollChance + cfg.shieldChance) {
          this.defAction = { type: "shield", until: t + 0.5 };
        }
      }
    }
    if (this.defAction && t > this.defAction.until) this.defAction = null;
    if (this.defAction) {
      wantsShield = true;
      if (this.defAction.type === "shield") {
        left = right = false;             // stand and block
      } else {
        left = this.defAction.dir < 0;    // shield+direction on the press frame = roll
        right = this.defAction.dir > 0;
      }
    }

    // Opportunistic item grabs: taco when hurt, star when the opponent is far
    const scene = this.self.scene;
    if (scene.items && scene.items.length && !this.defAction && !this.chargePlan) {
      for (const it of scene.items) {
        const idx = it.gfx.x - me.x;
        const wantHeal = it.def.key === "taco" && this.self.damage > 55;
        const wantStar = it.def.key === "star" && absDx > 260;
        if ((wantHeal || wantStar) && Math.abs(idx) < 420 && Math.abs(it.gfx.y - me.y) < 90) {
          left = idx < 0;
          right = idx > 0;
          break;
        }
      }
    }

    // We force-face the opponent when in (or near) attack range so wiggling/standing
    // never ends with us pointed the wrong way. Without this, the bot wastes 50%
    // of its tick budget facing away from you.
    const wantFace = (cfg.faceLock && absDx < ATTACK_RANGE + 60) ? Math.sign(dx) : 0;

    let chance, cdMin, cdRng;
    if (opponentStunned) {
      chance = cfg.comboAttackChance; cdMin = cfg.comboCdMin; cdRng = cfg.comboCdRange;
    } else if (opponentRecovering && cfg.whiffPunishChance > 0) {
      chance = cfg.whiffPunishChance; cdMin = cfg.attackCdMin; cdRng = cfg.attackCdRange;
    } else {
      chance = cfg.attackChance; cdMin = cfg.attackCdMin; cdRng = cfg.attackCdRange;
    }

    if (inRange) {
      if (this.reactionAt === 0) this.reactionAt = t + cfg.reactionDelay;
    } else {
      this.reactionAt = 0;
    }

    // Facing check uses the post-override facing — if we're force-facing, treat the
    // attack as facing-correct.
    const willFace = wantFace !== 0 ? wantFace : this.self.facing;
    const willFaceTowardThem = Math.sign(dx) === willFace;

    let atkUp = false, atkDown = false, holdAttack = false;

    // Charged smash: when the opponent is deep in hitstun, occasionally commit —
    // stand still holding Z (telegraphed!), then release the smash.
    if (!this.chargePlan && opponentStunned && this.opponent.damage > 45 && onGround
        && absDx < ATTACK_RANGE && Math.abs(dy) < 60 && willFaceTowardThem
        && t >= this.attackCooldown && Math.random() < cfg.comboAttackChance * 0.10) {
      this.chargePlan = t + 0.75;
      this.chargeStarted = false;
      this.attackCooldown = t + 1.1;   // no regular swings until this resolves
    }
    if (this.chargePlan) {
      if (t < this.chargePlan) {
        left = right = false;               // plant feet
        wantsAttack = !this.chargeStarted;  // press on the first frame (the jab that seeds the charge)
        this.chargeStarted = true;
        holdAttack = true;
      } else {
        this.chargePlan = null;             // release frame → Fighter fires the smash
      }
    } else if (inRange && (willFaceTowardThem || upWindow || spikeWindow) && !this.defAction
        && t >= this.attackCooldown
        && t >= this.reactionAt && Math.random() < chance) {
      wantsAttack = true;
      atkUp = upWindow;                     // Z+Up variant
      atkDown = spikeWindow && !upWindow;   // Z+Down airborne = spike
      this.attackCooldown = t + cdMin + Math.random() * cdRng;
    }

    // ---- Special usage --------------------------------------------------------
    // The right range for each special depends on its type.
    const sp = this.self.character.special;
    const specialReady = sp && t >= this.self.specialCooldownUntil;
    if (specialReady && !wantsAttack && !inHitstunSelf(this.self, t)) {
      const willingness = cfg.attackChance;  // reuse difficulty's aggressiveness
      if (sp.type === "lunge") {
        // Use lunge when opponent is just outside basic-attack range — close gap fast
        const lungeMinDx = ATTACK_RANGE + 30;
        const lungeMaxDx = ATTACK_RANGE + 280;
        if (absDx > lungeMinDx && absDx < lungeMaxDx
            && Math.abs(dy) < 90 && willFaceTowardThem
            && Math.random() < willingness * 0.4) {
          wantsSpecial = true;
        }
      } else if (sp.type === "projectile") {
        // Use projectiles at mid-to-long range, opponent roughly level
        const projMinDx = 240, projMaxDx = 900;
        if (absDx > projMinDx && absDx < projMaxDx
            && Math.abs(dy) < 120 && willFaceTowardThem
            && Math.random() < willingness * 0.5) {
          wantsSpecial = true;
        }
      } else if (sp.type === "grab") {
        // Grab when opponent is in tongue range and not already in basic attack range
        const grabMinDx = ATTACK_RANGE + 10;
        const grabMaxDx = sp.reach - 20;
        if (absDx > grabMinDx && absDx < grabMaxDx
            && Math.abs(dy) < 70 && willFaceTowardThem
            && Math.random() < willingness * 0.5) {
          wantsSpecial = true;
        }
      }
    }

    // Edge-detect for jump + attack + special
    const jumpPressed = wantsJump && !this.jumpHeld;
    const attackPressed = wantsAttack && !this.attackHeld;
    const specialPressed = wantsSpecial && !this.specialHeld;
    this.jumpHeld = wantsJump;
    this.attackHeld = wantsAttack;
    this.specialHeld = wantsSpecial;

    return { left, right,
             up: wantsJump || (wantsAttack && atkUp),      // held-up flag picks the variant
             down: wantsAttack && atkDown,
             jumpPressed, attackPressed, specialPressed, face: wantFace,
             shield: wantsShield, attackDown: holdAttack, attackReleased: false };
  }
}

function zeroInput() {
  return { left: false, right: false, up: false, down: false,
           jumpPressed: false, attackPressed: false, specialPressed: false, face: 0,
           shield: false, attackDown: false, attackReleased: false };
}

function inHitstunSelf(fighter, t) {
  return t < (fighter.hitstunUntil || 0);
}

// Flash a fighter for `ms` milliseconds. Uses setTint for sprites, setFillStyle
// for placeholder rectangles. Restores original look after.
function flashFighter(fighter, color, ms) {
  const sprite = fighter.sprite;
  if (fighter.useSprite) {
    sprite.setTint(color);
    fighter.scene.time.delayedCall(ms, () => { if (sprite) sprite.clearTint(); });
  } else {
    const orig = sprite.fillColor;
    sprite.setFillStyle(color);
    fighter.scene.time.delayedCall(ms, () => { if (sprite) sprite.setFillStyle(orig); });
  }
}

// ---- Juice helpers -----------------------------------------------------------

// Burst of small squares flying outward from a point; pure tweens, no physics.
function spawnBurst(scene, x, y, color, n = 8, speed = 180, size = 7, dur = 380) {
  for (let i = 0; i < n; i++) {
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.8;
    const dist = speed * (0.55 + Math.random() * 0.45);
    const p = scene.add.rectangle(x, y, size, size, color).setAngle(Math.random() * 90);
    scene.tweens.add({
      targets: p,
      x: x + Math.cos(ang) * dist,
      y: y + Math.sin(ang) * dist * 0.8,
      alpha: 0, scale: 0.2, angle: p.angle + 180,
      duration: dur * (0.7 + Math.random() * 0.6),
      ease: "Quad.easeOut",
      onComplete: () => p.destroy(),
    });
  }
}

// Rising damage number over the victim. Bigger hits get bigger, redder text.
function spawnDamageNumber(scene, x, y, dmg) {
  const big = dmg >= 14;
  const txt = scene.add.text(x + (Math.random() * 30 - 15), y - 50, Math.floor(dmg).toString(), {
    fontFamily: "Press Start 2P", fontSize: big ? "26px" : "17px",
    color: big ? "#ff5544" : "#ffee88", stroke: "#000000", strokeThickness: 5
  }).setOrigin(0.5).setScale(0.3);
  scene.tweens.add({ targets: txt, scale: 1, duration: 90, ease: "Back.easeOut" });
  scene.tweens.add({
    targets: txt, y: txt.y - 46, alpha: 0, duration: 650, delay: 120,
    onComplete: () => txt.destroy(),
  });
}

// Dust puff at a fighter's feet (jump / hard landing).
function spawnDust(scene, x, y, n = 5) {
  for (let i = 0; i < n; i++) {
    const p = scene.add.rectangle(x + (Math.random() * 36 - 18), y - 2, 6, 6, 0xccccbb, 0.7);
    scene.tweens.add({
      targets: p,
      x: p.x + (Math.random() * 50 - 25), y: p.y - 8 - Math.random() * 14,
      alpha: 0, scale: 1.8,
      duration: 300 + Math.random() * 150,
      onComplete: () => p.destroy(),
    });
  }
}

// ---- Fighter -----------------------------------------------------------------

class Fighter {
  constructor(scene, x, y, character, label) {
    this.scene = scene;
    this.character = character;
    this.stats = character.stats;
    this.label = label;
    this.damage = 0;
    this.damageDealt = 0;   // running total for the victory-screen stat line
    this.stocks = 3;
    this.facing = label === "P1" ? 1 : -1;
    this.airJumpsMax = character.stats.airJumpsMax || 1;  // multi-jumpers (Froggo, Jimmy) override
    this.airJumps = this.airJumpsMax;
    this.hitstunUntil = 0;
    this.attackUntil = 0;
    this.attackCooldownUntil = 0;
    this.activeHitbox = null;
    this.dashHit = false;         // set at startAttack: true if we were running fast at swing time
    // Special-move state
    this.specialCooldownUntil = 0;
    this.activeSpecial = null;    // {type, endTime, hitbox?, consumed} while a lunge/grab is live
    this.projectiles = [];        // Projectile entities currently in flight
    this.pulledUntil = 0;         // when > now, our motion is overridden by a grab
    // Defense state (shield / roll / airdodge)
    this.shielding = false;
    this.shieldHP = 100;          // drains while held + on blocked hits; regens otherwise
    this.shieldGfx = null;        // lazy-created bubble ellipse
    this.invulnUntil = 0;         // roll/airdodge i-frames
    this.rollUntil = 0;
    this.rollDir = 0;
    this.rollCooldownUntil = 0;
    this.prevShieldDown = false;
    // Charged smash state: tap Z = instant jab (unchanged); KEEP HOLDING Z past
    // the jab and a smash starts charging; release to unleash it.
    this.chargeStart = null;
    this.charging = false;
    this.chargeGfx = null;
    // Previous-frame body bottom + x for the floor-tunneling safety net, so it
    // only fires when we genuinely cross through the floor (not when re-entering
    // the stage x-range from below after being knocked off).
    this.prevBodyBottom = null;
    this.prevX = x;

    // Hit-detection size — kept independent of how the sprite is rendered so a
    // visually-large sprite doesn't suddenly have a huge hurtbox.
    this.hitW = 56;
    this.hitH = 92;
    const w = this.hitW, h = this.hitH;

    if (character.sprite && scene.textures.exists(character.id)) {
      // Real character art
      this.sprite = scene.physics.add.sprite(x, y, character.id, 0);
      const displayH = character.sprite.displayH || 130;
      const aspect = character.sprite.frameW / character.sprite.frameH;
      this.sprite.setDisplaySize(displayH * aspect, displayH);
      this.useSprite = true;
      this.eye = null;
    } else {
      // Placeholder rectangle (other characters until they get art)
      this.sprite = scene.add.rectangle(x, y, w, h, character.color).setStrokeStyle(3, character.accent);
      scene.physics.add.existing(this.sprite);
      this.useSprite = false;
      this.eye = scene.add.rectangle(x, y - 16, 14, 6, 0xffffff);
    }

    const body = this.sprite.body;
    if (this.useSprite) {
      // Arcade body sizes/offsets are in SOURCE-image pixels, not display pixels.
      // So a 56x92 display-pixel body needs to be set in source pixels:
      //   bodySrcW = displayBodyW / spriteScale
      const sp = character.sprite;
      const spriteScale = (sp.displayH || 130) / sp.frameH;
      const bodySrcW = w / spriteScale;
      const bodySrcH = h / spriteScale;
      // Position the body so its bottom sits at the character's feet line.
      // `feetY` is the fractional Y inside the frame (0..1) where the character's
      // feet are; defaults to 0.96 (near bottom).
      const feetFrac = sp.feetY != null ? sp.feetY : 0.96;
      const offsetX = (sp.frameW - bodySrcW) / 2;
      const offsetY = sp.frameH * feetFrac - bodySrcH;
      body.setSize(bodySrcW, bodySrcH, false);
      body.setOffset(offsetX, offsetY);
    } else {
      body.setSize(w, h, true);
    }
    body.setMaxVelocity(900, 1500);
    body.setGravityY(GRAVITY - scene.physics.world.gravity.y);
    body.setCollideWorldBounds(false);

    this.tag = scene.add.text(x, y - 70, label, {
      fontFamily: "Press Start 2P", fontSize: "14px", color: "#ffffff"
    }).setOrigin(0.5);
  }

  tick(dt, input, opponent) {
    const t = this.scene.time.now / 1000;
    const body = this.sprite.body;
    const onGround = body.blocked.down || body.touching.down;
    const inHitstun = t < this.hitstunUntil;
    const attacking = t < this.attackUntil;
    const inSpecial = this.activeSpecial && t < this.activeSpecial.endTime;
    const s = this.stats;

    if (onGround) this.airJumps = this.airJumpsMax;

    // Landing dust: touched down this frame after a real fall
    if (onGround && !this.wasOnGround && (this.prevVy || 0) > 420) {
      spawnDust(this.scene, this.sprite.x, body.y + body.height, 6);
    }
    this.wasOnGround = onGround;

    // Drive active specials (lunge/grab) and in-flight projectiles regardless of input
    if (inSpecial) this.tickActiveSpecial(t, opponent);
    else if (this.activeSpecial) this.endActiveSpecial();
    this.tickProjectiles(dt, opponent);

    // Shield press edge detection (C key / CPU defense flag)
    const shieldDown = !!input.shield;
    const shieldPressed = shieldDown && !this.prevShieldDown;
    this.prevShieldDown = shieldDown;

    // Getting hit (or starting a special) drops shield + charge
    if (inHitstun || inSpecial) {
      if (this.shielding) this.stopShield();
      this.cancelCharge();
    }

    const rolling = t < this.rollUntil;

    // (Grab pull is driven by a tween started in applyGrab; hitstun pins input here.)
    if (!inHitstun && !inSpecial) {
      if (rolling) {
        // Roll motion overrides everything for its duration
        body.setVelocityX(this.rollDir * 560);
      } else if (this.shielding) {
        body.setVelocityX(0);
        if (!shieldDown || !onGround) this.stopShield();
      } else {
        let vx = 0;
        if (input.left)  { vx -= s.walkSpeed; this.facing = -1; }
        if (input.right) { vx += s.walkSpeed; this.facing = 1; }
        if (input.face === -1 || input.face === 1) this.facing = input.face;
        if (attacking) vx *= 0.3;
        body.setVelocityX(vx);

        if (shieldPressed && t >= this.rollCooldownUntil && this.chargeStart == null) {
          // C + direction on ground = roll; C in air = airdodge; C neutral = shield
          const dir = input.left ? -1 : input.right ? 1 : 0;
          if (onGround && dir !== 0) this.startRoll(dir, t);
          else if (!onGround)        this.startAirdodge(t);
          else                       this.startShield(t);
        } else {
          if (input.jumpPressed) {
            if (onGround) {
              body.setVelocityY(s.jumpVel);
              spawnDust(this.scene, this.sprite.x, body.y + body.height, 4);
              if (this.label === "P1") SFX.play("jump");
            } else if (this.airJumps > 0) {
              body.setVelocityY(s.doubleJumpVel);
              this.airJumps -= 1;
              // Flip animation on the air jump (visual only — arcade bodies ignore angle)
              this.sprite.setAngle(0);
              this.scene.tweens.add({
                targets: this.sprite, angle: this.facing * 360, duration: 320,
                ease: "Quad.easeOut", onComplete: () => { if (this.sprite) this.sprite.setAngle(0); }
              });
              if (this.label === "P1") SFX.play("doubleJump");
            }
          }

          if (input.attackPressed && t >= this.attackCooldownUntil) {
            // Direction held at press picks the attack variant:
            //   Up = rising strike, Down on ground = low sweep, Down in air = SPIKE
            const variant = input.up ? "up" : input.down ? (onGround ? "downTilt" : "spike") : "jab";
            this.startAttack(opponent, variant, 1.0);
            SFX.play("attack");
            if (variant === "jab" && onGround) this.chargeStart = t;
          }
          if (input.specialPressed && t >= this.specialCooldownUntil) {
            this.cancelCharge();
            this.startSpecial(opponent);
          }
        }

        // Charged smash: kept holding Z past the jab? Charge builds; release fires.
        if (this.chargeStart != null) {
          if (!input.attackDown) {
            const held = t - this.chargeStart;
            const wasCharging = this.charging;
            this.cancelCharge();
            if (wasCharging && t >= this.attackUntil && onGround) {
              const mult = 1.35 + Math.min(1, (held - CHARGE_MIN) / 0.9) * 0.45;
              this.startAttack(opponent, "smash", mult);
              SFX.play("attack");
            }
          } else if (!this.charging && t - this.chargeStart > CHARGE_MIN && onGround) {
            this.charging = true;
            SFX.play("chargeFull");
            this.showChargeGlow();
          }
        }
      }
    }

    // Shield HP drain/regen + bubble / charge-glow tracking
    if (this.shielding) {
      this.shieldHP -= 16 * dt;
      if (this.shieldHP <= 0) this.shieldBreak();
    } else {
      this.shieldHP = Math.min(100, this.shieldHP + 22 * dt);
    }
    if (this.shieldGfx && this.shieldGfx.visible) {
      this.shieldGfx.x = this.sprite.x;
      this.shieldGfx.y = this.sprite.y - 6;
      const sc = 0.45 + 0.55 * Math.max(0, this.shieldHP) / 100;
      this.shieldGfx.setScale(sc);
    }
    if (this.chargeGfx && this.chargeGfx.visible) {
      this.chargeGfx.x = this.sprite.x;
      this.chargeGfx.y = this.sprite.y;
      this.chargeGfx.alpha = 0.28 + 0.18 * Math.sin(t * 22);
    }

    // Hitbox lifetime + hit detection
    if (this.activeHitbox && t >= this.activeHitbox.expires) {
      this.activeHitbox.gfx.destroy();
      this.activeHitbox = null;
    }
    if (this.activeHitbox && !this.activeHitbox.consumed) {
      const hb = this.activeHitbox;
      hb.gfx.x = this.sprite.x + this.facing * hb.offset;
      hb.gfx.y = this.sprite.y + (hb.offsetY || 0);
      const dx = Math.abs(hb.gfx.x - opponent.sprite.x);
      const dy = Math.abs(hb.gfx.y - opponent.sprite.y);
      if (dx < (hb.gfx.width / 2 + opponent.hitW / 2) &&
          dy < (hb.gfx.height / 2 + opponent.hitH / 2)) {
        this.applyHit(opponent, hb);
        hb.consumed = true;
      }
    }

    // Update sprite frame + facing flip for animated characters
    if (this.useSprite) {
      let frame = 0;  // idle
      if (inHitstun)       frame = 4;
      else if (attacking || inSpecial) frame = 3;
      else if (!onGround)  frame = 2;
      // Two-frame walk cycle (walk/idle alternating at ~7fps) — cheap but sells motion
      else if (Math.abs(body.velocity.x) > 50) frame = Math.floor(t * 7) % 2 === 0 ? 1 : 0;
      this.sprite.setFrame(frame);
      this.sprite.setFlipX(this.facing === -1);
      // Power Star glow: pulsing gold tint while active
      if (t < (this.powerUntil || 0)) {
        this.sprite.setTint(Math.floor(t * 8) % 2 === 0 ? 0xffe08a : 0xffc040);
      } else if (this.powerUntil && t < this.powerUntil + 0.1) {
        this.sprite.clearTint();
      }
    } else {
      this.eye.x = this.sprite.x + this.facing * 10;
      this.eye.y = this.sprite.y - 16;
    }
    this.tag.x = this.sprite.x;
    this.tag.y = this.sprite.y - 70;

    // Safety net: if the body is over the floor footprint but the body bottom
    // has somehow dropped below the floor surface (rare physics edge case with
    // sprite bodies + tween-driven position resets), snap them back up. Without
    // this we occasionally fall straight through the stage mid-match.
    // Only fire when we genuinely CROSSED the floor this frame (last frame we
    // were above it while over the stage) — otherwise a fighter knocked off the
    // edge could drift back under the stage and get a free teleport recovery.
    if (body && this.sprite.x > 50 && this.sprite.x < W - 50) {
      const floorTop = GROUND_Y;
      const bottomNow = body.y + body.height;
      const crossedFloor = this.prevBodyBottom != null &&
        this.prevBodyBottom <= floorTop + 6 &&
        this.prevX > 50 && this.prevX < W - 50;
      if (crossedFloor && bottomNow > floorTop + 6 && this.sprite.y < DEATH_BOTTOM - 80) {
        this.sprite.y -= (bottomNow - floorTop);
        body.setVelocityY(0);
      }
    }
    this.prevBodyBottom = body ? body.y + body.height : null;
    this.prevX = this.sprite.x;
    this.prevVy = body ? body.velocity.y : 0;

    if (this.sprite.x < DEATH_LEFT || this.sprite.x > DEATH_RIGHT || this.sprite.y > DEATH_BOTTOM) {
      this.loseStock();
    }
  }

  startAttack(opponent, variant = "jab", chargeMult = 1) {
    const t = this.scene.time.now / 1000;
    const s = this.stats;
    // Variant profiles: hitbox geometry + damage/knockback/cooldown multipliers.
    //   jab      — the classic forward swing (tap Z)
    //   up       — rising strike above the head (Z + Up held); anti-air launcher
    //   downTilt — fast low sweep on the ground (Z + Down); pops up, combo starter
    //   spike    — downward air strike (Z + Down airborne); METEORS airborne victims
    //   smash    — charged release (hold Z past the jab); big damage + knockback
    const V = {
      jab:      { dmgMult: 1.0,  kbMult: 1.0,  cdMult: 1.0,  w: s.attackRange,      h: 50,
                  dx: s.attackRange / 2 + 18,        dy: 0,                       color: 0xffeebb },
      up:       { dmgMult: 1.0,  kbMult: 1.0,  cdMult: 1.15, w: 84,                h: 74,
                  dx: 18,                            dy: -(this.hitH / 2 + 26),   color: 0xbbe0ff },
      downTilt: { dmgMult: 0.7,  kbMult: 0.75, cdMult: 0.7,  w: s.attackRange * 0.95, h: 30,
                  dx: s.attackRange / 2 + 10,        dy: 30,                      color: 0xd0ffb0 },
      spike:    { dmgMult: 1.1,  kbMult: 1.0,  cdMult: 1.25, w: 74,                h: 60,
                  dx: 10,                            dy: this.hitH / 2 + 20,      color: 0xffb0d0 },
      smash:    { dmgMult: 1.0,  kbMult: 1.0,  cdMult: 1.6,  w: s.attackRange + 24, h: 62,
                  dx: (s.attackRange + 24) / 2 + 18, dy: 0,                       color: 0xffcc66 },
    }[variant];
    this.attackUntil = t + ATTACK_DURATION;
    this.attackCooldownUntil = t + s.attackCooldown * V.cdMult;
    // Dash-attack bonus: if we were running near top speed when we swing, the
    // hit deals +25% damage and knockback. Jab-only — smash/tilts have their own identity.
    this.dashHit = variant === "jab" && Math.abs(this.sprite.body.velocity.x) > s.walkSpeed * 0.6;

    const hbX = this.sprite.x + this.facing * V.dx;
    const hbY = this.sprite.y + V.dy;
    const gfx = this.scene.add.rectangle(hbX, hbY, V.w, V.h, V.color, 0.55).setStrokeStyle(2, 0xffaa33);
    if (this.useSprite) gfx.setVisible(false);  // sprite has its own swing pose
    this.activeHitbox = { gfx, expires: t + ATTACK_DURATION, consumed: false,
                          offset: V.dx, offsetY: V.dy, variant, chargeMult,
                          dmgMult: V.dmgMult, kbMult: V.kbMult };

    // Brief squash recoil — only for rectangle fighters. For sprites, the
    // absolute scaleX/Y values would multiply the source body size and punch
    // the character through the floor.
    if (!this.useSprite) {
      this.scene.tweens.add({
        targets: this.sprite, scaleX: 1.15, scaleY: 0.92, duration: 60, yoyo: true
      });
    }
  }

  // ---- Defense (shield / roll / airdodge) ------------------------------------

  startShield(t) {
    if (this.shieldHP <= 8) return;  // too cracked to raise
    this.shielding = true;
    SFX.play("shieldOn");
    if (!this.shieldGfx) {
      this.shieldGfx = this.scene.add.ellipse(this.sprite.x, this.sprite.y - 6, 116, 136, 0x66bbff, 0.32)
        .setStrokeStyle(2, 0xaaddff);
    }
    this.shieldGfx.setVisible(true);
  }

  stopShield() {
    this.shielding = false;
    if (this.shieldGfx) this.shieldGfx.setVisible(false);
  }

  shieldBreak() {
    const t = this.scene.time.now / 1000;
    this.stopShield();
    this.shieldHP = 50;
    this.hitstunUntil = t + 1.6;   // long punish window — don't just mash C
    SFX.play("shieldBreak");
    flashFighter(this, 0xffff66, 300);
    spawnBurst(this.scene, this.sprite.x, this.sprite.y - 10, 0x66bbff, 12, 240);
    this.floatText("SHIELD BREAK!", "#ff6666");
    this.scene.cameras.main.shake(220, 0.008);
  }

  startRoll(dir, t) {
    this.rollUntil = t + 0.32;
    this.rollDir = dir;
    this.invulnUntil = t + 0.30;
    this.rollCooldownUntil = t + 0.9;
    this.sprite.alpha = 0.45;
    this.scene.time.delayedCall(320, () => { if (this.sprite) this.sprite.alpha = 1; });
    SFX.play("roll");
  }

  startAirdodge(t) {
    this.invulnUntil = t + 0.30;
    this.rollCooldownUntil = t + 0.9;
    this.sprite.alpha = 0.45;
    this.scene.time.delayedCall(300, () => { if (this.sprite) this.sprite.alpha = 1; });
    SFX.play("roll");
  }

  cancelCharge() {
    this.chargeStart = null;
    this.charging = false;
    if (this.chargeGfx) this.chargeGfx.setVisible(false);
  }

  showChargeGlow() {
    if (!this.chargeGfx) {
      this.chargeGfx = this.scene.add.ellipse(this.sprite.x, this.sprite.y, 130, 130, 0xffcc44, 0.3);
    }
    this.chargeGfx.setVisible(true);
  }

  // Returns true if the incoming hit was dodged or shielded (attacker should bail).
  // kind "grab" pierces shields (the classic rock-paper-scissors) but not i-frames.
  tryDefend(attacker, dmg, kind) {
    const t = this.scene.time.now / 1000;
    if (t < this.invulnUntil) {
      this.floatText("DODGE!", "#88ddff");
      return true;
    }
    if (this.shielding && kind !== "grab") {
      this.shieldHP -= dmg * 2.4;
      const dir = Math.sign(this.sprite.x - attacker.sprite.x) || 1;
      this.sprite.body.setVelocityX(dir * 160);
      SFX.play("shieldHit");
      if (this.shieldHP <= 0) this.shieldBreak();
      return true;
    }
    return false;
  }

  floatText(msg, color) {
    const txt = this.scene.add.text(this.sprite.x, this.sprite.y - 70, msg, {
      fontFamily: "Press Start 2P", fontSize: "16px", color,
      stroke: "#000000", strokeThickness: 4
    }).setOrigin(0.5);
    this.scene.tweens.add({
      targets: txt, y: txt.y - 36, alpha: 0, duration: 600,
      onComplete: () => txt.destroy()
    });
  }

  // ---- Specials --------------------------------------------------------------

  startSpecial(opponent) {
    const t = this.scene.time.now / 1000;
    const sp = this.character.special;
    if (!sp) return;
    this.specialCooldownUntil = t + sp.cooldown;

    if (sp.type === "lunge") {
      SFX.play("lunge");
      // Dash forward with an active hitbox attached to our body
      const w = sp.dashSpeed;
      this.sprite.body.setVelocity(this.facing * w, -150);
      const hbW = this.stats.attackRange + 30, hbH = 64;
      const offset = hbW / 2 + 16;
      // Spawn at the real initial position so point-blank hits land on frame 1
      // (tickActiveSpecial only repositions it from the NEXT frame onward).
      const gfx = this.scene.add.rectangle(
        this.sprite.x + this.facing * offset, this.sprite.y, hbW, hbH, 0xff8844, 0.65)
        .setStrokeStyle(2, 0xffcc55);
      if (this.useSprite) gfx.setVisible(false);
      this.activeSpecial = {
        type: "lunge",
        endTime: t + sp.duration,
        hitbox: { gfx, offset, w: hbW, h: hbH },
        consumed: false,
        sp,
      };
      // Bigfoot's "Photo Blur" — go blurry (semi-transparent) for the dash
      if (sp.blur) this.sprite.alpha = 0.45;
      // Recoil cue
      if (!this.useSprite) {
        this.scene.tweens.add({ targets: this.sprite, scaleX: 1.25, scaleY: 0.85, duration: 80, yoyo: true });
      }
    }
    else if (sp.type === "projectile") {
      SFX.play("projectile");
      const px = this.sprite.x + this.facing * 50;
      const py = this.sprite.y - 4;
      const vx = this.facing * sp.projectileSpeed;
      const vy = sp.gravityY > 0 ? -60 : 0;
      const proj = new Projectile(this.scene, this, px, py, vx, vy, sp);
      this.projectiles.push(proj);
      // Small forward step + recoil cue
      this.sprite.body.setVelocityX(this.facing * 60);
      if (!this.useSprite) {
        this.scene.tweens.add({ targets: this.sprite, scaleX: 0.9, scaleY: 1.1, duration: 70, yoyo: true });
      }
    }
    else if (sp.type === "grab") {
      SFX.play("grab");
      // Long thin reach; if it overlaps opponent during extendTime, snap them in
      const hbW = sp.reach, hbH = 22;
      const offset = hbW / 2 + 12;
      // Spawn at the real initial position so point-blank grabs land on frame 1.
      const gfx = this.scene.add.rectangle(
        this.sprite.x + this.facing * offset, this.sprite.y, hbW, hbH, 0xff66aa, 0.6)
        .setStrokeStyle(2, 0xff99cc);
      if (this.useSprite) gfx.setVisible(false);
      this.activeSpecial = {
        type: "grab",
        endTime: t + sp.extendTime,
        hitbox: { gfx, offset, w: hbW, h: hbH },
        consumed: false,
        sp,
      };
      // Anchor in place while extending
      this.sprite.body.setVelocityX(0);
    }
  }

  tickActiveSpecial(t, opponent) {
    const a = this.activeSpecial;
    if (!a) return;
    if (a.type === "lunge" || a.type === "grab") {
      const hb = a.hitbox;
      hb.gfx.x = this.sprite.x + this.facing * hb.offset;
      hb.gfx.y = this.sprite.y;
      if (!a.consumed) {
        const dx = Math.abs(hb.gfx.x - opponent.sprite.x);
        const dy = Math.abs(hb.gfx.y - opponent.sprite.y);
        if (dx < (hb.w / 2 + opponent.hitW / 2) &&
            dy < (hb.h / 2 + opponent.hitH / 2)) {
          if (a.type === "lunge") {
            this.applySpecialHit(opponent, a.sp);
          } else {
            this.applyGrab(opponent, a.sp);
          }
          a.consumed = true;
        }
      }
    }
  }

  endActiveSpecial() {
    if (this.activeSpecial && this.activeSpecial.hitbox) {
      this.activeSpecial.hitbox.gfx.destroy();
    }
    // Restore Photo Blur transparency (harmless overlap with roll-ghost restore)
    if (this.activeSpecial && this.activeSpecial.sp && this.activeSpecial.sp.blur) {
      this.sprite.alpha = 1;
    }
    this.activeSpecial = null;
  }

  tickProjectiles(dt, opponent) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      if (p.tick(dt, opponent)) {
        this.projectiles.splice(i, 1);
      }
    }
  }

  applySpecialHit(opponent, sp) {
    const t = this.scene.time.now / 1000;
    const powerMult = t < (this.powerUntil || 0) ? 1.5 : 1.0;
    const dmg = sp.dmg * powerMult;
    if (opponent.tryDefend(this, dmg, "special")) return;
    opponent.damage += dmg;
    this.damageDealt += dmg;
    const dir = Math.sign(opponent.sprite.x - this.sprite.x) || this.facing;
    const rawKb = (sp.kbBase + opponent.damage * ATTACK_KB_SCALE) * powerMult;
    const kb = rawKb / opponent.stats.weight;
    opponent.sprite.body.setVelocity(dir * kb, -kb * 0.6);
    opponent.hitstunUntil = t + (HITSTUN_BASE + opponent.damage * 0.003) / opponent.stats.weight;
    opponent.airJumps = Math.max(opponent.airJumps, 1);
    flashFighter(opponent, 0xffffff, 80);
    this.scene.cameras.main.shake(160, 0.007);
    this.scene.hitstop(80);
